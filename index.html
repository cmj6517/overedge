: "양면시장은 e-Business 전략론의 실제 의사결정 구조와 직결되는 개념이라는 점에서 살펴볼 필요가 있다. 논의의 출발점이 되는 정의는 다음과 같다. 플랫폼이 서로 다른 두 이용자 집단을 연결하며 한쪽 집단의 규모가 다른 쪽의 가치에 영향을 미치는 시장이다.\n\n이 개념을 구성하는 요소들은 두 집단, 교차효과의 관계로 연결되어 있으며, 이는 논리의 뼈대를 이룬다. 이 구조를 순서대로 되짚어보면, 왜 그 요소가 그 위치에 놓이는지에 대한 근거가 함께 드러난다. 구체적으로 '두 집단'이 논의의 출발점을 이루고 '교차효과'로 귀결되는 구조인데, 이 양 끝을 생략한 채 중간 요소만 나열하면 왜 그러한 순서가 성립하는지에 대한 설명력이 떨어진다.\n\n실제 사례에 비추어 보면 위 논의가 추상적 정의에 그치지 않음을 알 수 있다. 예컨대 B2B 조달 플랫폼이 구매기업과 공급기업 양쪽의 거래 데이터를 활용해 신뢰 기반 거버넌스를 구축하는 상황을 가정할 때, 이 틀을 적용하면 우선순위가 불분명한 상황에서도 검증 순서와 자원 배분의 근거를 마련할 수 있다. 반대로 전통 제조기업이 온라인 직판 채널을 도입하며 공급망과 고객데이터를 통합하는 디지털 전환 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n정리하자면 양면시장은 정의, 근거, 적용이라는 세 층위가 함께 성립할 때 비로소 완전한 설명이 된다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다.", "answer_len": 1116, "mnemonic_raw": "두 집단·교차효과", "mnemonic_tree": {"type": "list", "children": [{"type": "single", "text": "두 집단"}, {"type": "single", "text": "교차효과"}]}, "stars": ""}, {"id": 133, "part": "short50", "category": "e-Business 전략론", "num": 33, "question": "플랫폼의 닭과 달걀 문제란 무엇인가?", "phd_answer": "플랫폼의 닭과 달걀 문제에 대한 이해는 e-Business 전략론 영역의 다른 개념들을 해석하는 출발점이 된다는 점에서 중요하다. 정의를 먼저 확인하면 다음과 같이 정리된다. 초기에 공급자가 없으면 소비자가 오지 않고 소비자가 없으면 공급자도 참여하지 않아 성장이 시작되기 어려운 문제이다.\n\n이 개념의 내부 구조를 도식화하면 초기 공급, 수요 부족의 형태로 나타낼 수 있다. 각 요소는 독립적으로 작동하는 것이 아니라 앞선 요소의 결과가 다음 요소의 전제가 되는 방식으로 연결되어 있다. 특히 '초기 공급'에서 시작해 '수요 부족'으로 끝나는 이 순서를 뒤바꾸어 서술하면 논리 자체가 성립하지 않는다는 점에 유의해야 한다.\n\n구체적인 장면으로 옮겨보면 이 개념이 왜 필요한지가 자연스럽게 드러난다. 예컨대 국내 배달 플랫폼이 음식점과 소비자라는 두 참여자 집단의 균형 성장을 관리하는 상황을 가정할 때, 이 과정에서 개념은 단순한 지식이 아니라 실제 선택을 좌우하는 판단 도구로 전환된다. 반대로 커머스 플랫폼이 자체 물류망 구축을 통해 배송속도와 재구매율을 동시에 높이려는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n결국 플랫폼의 닭과 달걀 문제에 대한 이해는 정의를 아는 데서 끝나지 않고, 그 정의가 어떤 조건에서 어떻게 작동하는지를 설명할 수 있을 때 완성된다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다.", "answer_len": 1106, "mnemonic_raw": "초기 공급·수요 부족", "mnemonic_tree": {"type": "list", "children": [{"type": "single", "text": "초기 공급"}, {"type": "single", "text": "수요 부족"}]}, "stars": ""}, {"id": 134, "part": "short50", "category": "e-Business 전략론", "num": 34, "question": "SCM의 목적을 설명하시오.", "phd_answer": "SCM의 목적을 정확히 이해하는 것은 e-Business 전략론 전반의 논리 체계를 파악하는 데 중요한 단서가 된다. 정의를 먼저 확인하면 다음과 같이 정리된다. 조달부터 생산, 재고, 물류, 배송까지 공급흐름을 통합 관리하여 비용을 줄이고 고객서비스를 높이는 것이다.\n\n핵심 요소들을 재배열해 보면 공급망 통합, 비용, 배송과 같은 흐름으로 전개된다는 점이 드러난다. 요소 간의 연결고리를 생략한 채 나열하면 개념의 표면만 알 뿐 그것이 작동하는 방식은 설명하지 못한다. 이 가운데 첫 단계인 '공급망 통합'은 왜 다른 요소보다 먼저 검토되어야 하는지, 그리고 마지막 단계인 '배송'이 왜 그 지점에서 논의가 마무리되는지를 함께 설명할 수 있어야 한다.\n\n이론을 실제 국면에 적용해 보면 개념의 쓰임새가 한층 뚜렷해진다. 예컨대 중고거래 플랫폼이 초기 공급자 부족의 '닭과 달걀' 문제를 해결하기 위해 특정 지역에 집중하는 상황을 가정할 때, 이 틀을 적용하면 우선순위가 불분명한 상황에서도 검증 순서와 자원 배분의 근거를 마련할 수 있다. 반대로 예약중개 플랫폼이 멀티호밍이 쉬운 경쟁환경에서 자사 서비스의 전환비용을 높이려는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n따라서 SCM의 목적은 고정된 정의가 아니라, 상황과 조건에 따라 적용 방식이 달라지는 살아있는 기준으로 이해되어야 한다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다.", "answer_len": 1120, "mnemonic_raw": "공급망 통합·비용·배송", "mnemonic_tree": {"type": "list", "children": [{"type": "single", "text": "공급망 통합"}, {"type": "single", "text": "비용"}, {"type": "single", "text": "배송"}]}, "stars": ""}, {"id": 135, "part": "short50", "category": "e-Business 전략론", "num": 35, "question": "디지털 전환(DX)이란 무엇인가?", "phd_answer": "디지털 전환(DX)는 이론적으로도, 실무적으로도 판단의 기준선이 되는 개념이라는 점에서 주목할 필요가 있다. 먼저 개념을 정리하면 다음과 같다. 디지털 기술을 이용해 고객경험, 운영, 의사결정과 비즈니스 모델을 근본적으로 재설계하는 과정이다.\n\n핵심을 추려보면 기술도입 아닌 사업 재설계라는 틀로 요약되며, 이 틀이 곧 개념 전개의 축이 된다. 이 요소들 사이의 순서와 인과관계를 이해하지 않으면 각 요소를 개별적으로만 파악하게 되어 전체 메커니즘을 설명하기 어렵다.\n\n이를 실무의 언어로 바꾸어 보면 다음과 같은 방식으로 나타난다. 예컨대 전통 제조기업이 온라인 직판 채널을 도입하며 공급망과 고객데이터를 통합하는 디지털 전환 상황을 가정할 때, 이 사례는 이론이 현장에서 구체적인 실행 순서로 번역되는 과정을 잘 보여준다. 반대로 B2B 조달 플랫폼이 구매기업과 공급기업 양쪽의 거래 데이터를 활용해 신뢰 기반 거버넌스를 구축하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n종합하면 디지털 전환(DX)는 이론적 정의와 실무적 적용이 맞물릴 때 비로소 온전한 의미를 갖는 개념이라 할 수 있다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다.", "answer_len": 1008, "mnemonic_raw": "기술도입 아닌 사업 재설계", "mnemonic_tree": {"type": "single", "text": "기술도입 아닌 사업 재설계"}, "stars": ""}, {"id": 136, "part": "short50", "category": "e-Business 전략론", "num": 36, "question": "Winner-Takes-All이란 무엇인가?", "phd_answer": "Winner-Takes-All를 논하는 것은 e-Business 전략론 분야에서 개념과 실행 사이의 간극을 좁히는 작업이라 할 수 있다. 논지를 전개하기 앞서 개념을 다음과 같이 규정한다. 네트워크 효과와 규모의 경제 등으로 선도 플랫폼에 이용자와 가치가 집중되어 시장의 대부분을 차지하는 현상이다.\n\n이 개념을 세분화하면 선도자 집중의 순서로 요소들이 연결되어 있음을 확인할 수 있다. 요소를 열거하는 것과 요소 간의 인과관계를 설명하는 것은 이해의 깊이에서 분명한 차이를 만든다.\n\n이를 현장의 맥락에서 살펴보면 다음과 같은 시사점을 얻을 수 있다. 예컨대 커머스 플랫폼이 자체 물류망 구축을 통해 배송속도와 재구매율을 동시에 높이려는 상황을 가정할 때, 이러한 적용 과정을 통해 이론적 개념이 현장의 판단 기준으로 작동함을 확인할 수 있다. 반대로 국내 배달 플랫폼이 음식점과 소비자라는 두 참여자 집단의 균형 성장을 관리하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n요컨대 Winner-Takes-All의 핵심은 개념 자체보다 그것이 다른 요소들과 맺는 관계를 설명해내는 데 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다.", "answer_len": 1005, "mnemonic_raw": "선도자 집중", "mnemonic_tree": {"type": "single", "text": "선도자 집중"}, "stars": ""}, {"id": 137, "part": "short50", "category": "e-Business 전략론", "num": 37, "question": "전환비용(Switching Cost)이란 무엇인가?", "phd_answer": "전환비용(Switching Cost)를 논하는 것은 e-Business 전략론 분야에서 개념과 실행 사이의 간극을 좁히는 작업이라 할 수 있다. 이를 개념적으로 규정하면 아래와 같다. 고객이 기존 제품이나 플랫폼에서 다른 대안으로 이동할 때 부담해야 하는 금전적·시간적·학습적 비용이다.\n\n이를 뒷받침하는 핵심 구성요소를 순서대로 살펴보면, 그 논리 구조는 이동에 드는 비용의 흐름으로 정리된다. 각 요소가 서로를 어떻게 뒷받침하는지를 설명할 수 있어야 이 개념을 온전히 이해했다고 할 수 있다.\n\n이를 실무의 언어로 바꾸어 보면 다음과 같은 방식으로 나타난다. 예컨대 예약중개 플랫폼이 멀티호밍이 쉬운 경쟁환경에서 자사 서비스의 전환비용을 높이려는 상황을 가정할 때, 이 과정에서 개념은 단순한 지식이 아니라 실제 선택을 좌우하는 판단 도구로 전환된다. 반대로 중고거래 플랫폼이 초기 공급자 부족의 '닭과 달걀' 문제를 해결하기 위해 특정 지역에 집중하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n결국 전환비용(Switching Cost)에 대한 이해는 정의를 아는 데서 끝나지 않고, 그 정의가 어떤 조건에서 어떻게 작동하는지를 설명할 수 있을 때 완성된다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다.", "answer_len": 1046, "mnemonic_raw": "이동에 드는 비용", "mnemonic_tree": {"type": "single", "text": "이동에 드는 비용"}, "stars": ""}, {"id": 138, "part": "short50", "category": "벤처테마개발론", "num": 38, "question": "기업가정신의 대표적 구성요소 세 가지를 쓰시오.", "phd_answer": "기업가정신의 대표적 구성요소 세 가지에 관한 논의는 벤처테마개발론의 다른 세부 개념을 이해하기 위한 전제조건에 가깝다. 핵심 정의부터 짚어보면 다음과 같이 요약할 수 있다. 혁신성, 진취성, 위험감수성이 대표적이다.\n\n이 개념을 구성하는 요소들은 혁신, 진취, 위험감수의 관계로 연결되어 있으며, 이는 논리의 뼈대를 이룬다. 이 구조를 순서대로 되짚어보면, 왜 그 요소가 그 위치에 놓이는지에 대한 근거가 함께 드러난다. '혁신'에서 출발해 '위험감수'로 이어지는 이 흐름은 임의의 나열이 아니라, 앞 단계가 다음 단계의 조건이 되는 인과적 배열이다.\n\n이를 현장의 맥락에서 살펴보면 다음과 같은 시사점을 얻을 수 있다. 예컨대 AI 에이전트 기반 스타트업이 범용 모델과 차별화되는 도메인 데이터를 축적해가는 상황을 가정할 때, 이렇게 보면 개념을 이해한다는 것은 곧 무엇을 먼저 검증해야 하는지를 아는 것과 다르지 않다. 반대로 초기 2인 공동창업팀이 MVP로 유료전환 가설을 검증한 뒤 시드 투자를 유치하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n정리하자면 기업가정신의 대표적 구성요소 세 가지는 정의, 근거, 적용이라는 세 층위가 함께 성립할 때 비로소 완전한 설명이 된다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다.", "answer_len": 1057, "mnemonic_raw": "혁신·진취·위험감수", "mnemonic_tree": {"type": "list", "children": [{"type": "single", "text": "혁신"}, {"type": "single", "text": "진취"}, {"type": "single", "text": "위험감수"}]}, "stars": ""}, {"id": 139, "part": "short50", "category": "벤처테마개발론", "num": 39, "question": "사업 아이디어와 사업기회의 차이를 설명하시오.", "phd_answer": "사업 아이디어와 사업기회의 차이는 벤처테마개발론의 실제 의사결정 구조와 직결되는 개념이라는 점에서 살펴볼 필요가 있다. 우선 이 개념의 정의를 명확히 해 둘 필요가 있다. 아이디어는 새로운 제품·서비스에 대한 생각이고 사업기회는 고객문제, 시장성, 실행 가능성과 수익성이 검증된 아이디어이다.\n\n요소별로 쪼개어 보면 생각 vs 검증된 기회의 관계가 이 개념의 골격을 이루고 있음을 알 수 있다. 이러한 연결 관계를 함께 짚을 때 비로소 '왜 그런가'에 대한 설명이 완성된다.\n\n현장 상황에 대응시켜 보면 이 개념의 실질적 쓸모를 확인할 수 있다. 예컨대 AI 기반 헬스케어 스타트업이 병원 워크플로에 서비스를 통합하며 PMF를 검증하는 상황을 가정할 때, 이는 추상적 개념이 구체적 실행 지침으로 전환되는 과정을 보여준다. 반대로 제조 스타트업이 대기업과 정면경쟁 대신 틈새시장에서 초기 충성고객을 확보하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n종합하면 사업 아이디어와 사업기회의 차이는 이론적 정의와 실무적 적용이 맞물릴 때 비로소 온전한 의미를 갖는 개념이라 할 수 있다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다.", "answer_len": 1000, "mnemonic_raw": "생각 vs 검증된 기회", "mnemonic_tree": {"type": "single", "text": "생각 vs 검증된 기회"}, "stars": ""}, {"id": 140, "part": "short50", "category": "벤처테마개발론", "num": 40, "question": "가치제안(Value Proposition)이란 무엇인가?", "phd_answer": "벤처테마개발론의 여러 개념 가운데 가치제안(Value Proposition)는 정의의 정확성과 적용력을 함께 요구하는 대표적 사례이다. 논의의 출발점이 되는 정의는 다음과 같다. 특정 고객의 중요한 문제를 어떤 차별적 방법으로 해결하고 어떤 가치를 제공하는지를 명확히 표현한 것이다.\n\n이를 뒷받침하는 핵심 구성요소를 순서대로 살펴보면, 그 논리 구조는 누구의 어떤 문제를 어떻게 해결의 흐름으로 정리된다. 각 요소는 독립적으로 작동하는 것이 아니라 앞선 요소의 결과가 다음 요소의 전제가 되는 방식으로 연결되어 있다.\n\n이 논리를 현실에 대입해 보면 그 함의가 더 분명해진다. 예컨대 대학 실험실 기술을 기반으로 한 딥테크 스타트업이 PoC 이후 사업화 경로를 설계하는 상황을 가정할 때, 위 개념 틀은 실제 의사결정 과정에서 무엇을 먼저 검증하고 자원을 어디에 배분할지 판단하는 기준으로 기능한다. 반대로 구독형 B2B 스타트업이 성장단계에 맞춰 창업자의 역할을 실행자에서 조직 설계자로 전환하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n따라서 가치제안(Value Proposition)는 고정된 정의가 아니라, 상황과 조건에 따라 적용 방식이 달라지는 살아있는 기준으로 이해되어야 한다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다.", "answer_len": 1063, "mnemonic_raw": "누구의 어떤 문제를 어떻게 해결", "mnemonic_tree": {"type": "single", "text": "누구의 어떤 문제를 어떻게 해결"}, "stars": ""}, {"id": 141, "part": "short50", "category": "벤처테마개발론", "num": 41, "question": "MVP란 무엇인가?", "phd_answer": "MVP는 이론적으로도, 실무적으로도 판단의 기준선이 되는 개념이라는 점에서 주목할 필요가 있다. 핵심 정의부터 짚어보면 다음과 같이 요약할 수 있다. 핵심 사업가설을 검증하는 데 필요한 최소한의 기능을 가진 제품 또는 최소한의 실험이다.\n\n핵심을 추려보면 최소자원, 최대학습라는 틀로 요약되며, 이 틀이 곧 개념 전개의 축이 된다. 요소 간의 연결고리를 생략한 채 나열하면 개념의 표면만 알 뿐 그것이 작동하는 방식은 설명하지 못한다. 구체적으로 '최소자원'이 논의의 출발점을 이루고 '최대학습'으로 귀결되는 구조인데, 이 양 끝을 생략한 채 중간 요소만 나열하면 왜 그러한 순서가 성립하는지에 대한 설명력이 떨어진다.\n\n구체적인 상황에 적용해 보면 이 개념의 실천적 가치가 드러난다. 예컨대 초기 2인 공동창업팀이 MVP로 유료전환 가설을 검증한 뒤 시드 투자를 유치하는 상황을 가정할 때, 위 개념 틀은 실제 의사결정 과정에서 무엇을 먼저 검증하고 자원을 어디에 배분할지 판단하는 기준으로 기능한다. 반대로 AI 에이전트 기반 스타트업이 범용 모델과 차별화되는 도메인 데이터를 축적해가는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n결국 MVP에 대한 이해는 정의를 아는 데서 끝나지 않고, 그 정의가 어떤 조건에서 어떻게 작동하는지를 설명할 수 있을 때 완성된다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다.", "answer_len": 1104, "mnemonic_raw": "최소자원·최대학습", "mnemonic_tree": {"type": "list", "children": [{"type": "single", "text": "최소자원"}, {"type": "single", "text": "최대학습"}]}, "stars": ""}, {"id": 142, "part": "short50", "category": "벤처테마개발론", "num": 42, "question": "린 스타트업의 세 단계를 쓰시오.", "phd_answer": "린 스타트업의 세 단계는 벤처테마개발론에서 이론적 토대와 실무적 판단기준을 동시에 제공하는 핵심 개념이다. 정의를 먼저 확인하면 다음과 같이 정리된다. Build(만들기), Measure(측정), Learn(학습)이다.\n\n요소별로 쪼개어 보면 Build-Measure-Learn의 관계가 이 개념의 골격을 이루고 있음을 알 수 있다. 이 구조를 순서대로 되짚어보면, 왜 그 요소가 그 위치에 놓이는지에 대한 근거가 함께 드러난다. 특히 'Build'에서 시작해 'Learn'로 끝나는 이 순서를 뒤바꾸어 서술하면 논리 자체가 성립하지 않는다는 점에 유의해야 한다.\n\n구체적인 장면으로 옮겨보면 이 개념이 왜 필요한지가 자연스럽게 드러난다. 예컨대 제조 스타트업이 대기업과 정면경쟁 대신 틈새시장에서 초기 충성고객을 확보하는 상황을 가정할 때, 이 과정에서 개념은 단순한 지식이 아니라 실제 선택을 좌우하는 판단 도구로 전환된다. 반대로 AI 기반 헬스케어 스타트업이 병원 워크플로에 서비스를 통합하며 PMF를 검증하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n종합하면 린 스타트업의 세 단계는 이론적 정의와 실무적 적용이 맞물릴 때 비로소 온전한 의미를 갖는 개념이라 할 수 있다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다.", "answer_len": 1057, "mnemonic_raw": "Build-Measure-Learn", "mnemonic_tree": {"type": "sequence", "children": [{"type": "single", "text": "Build"}, {"type": "single", "text": "Measure"}, {"type": "single", "text": "Learn"}]}, "stars": ""}, {"id": 143, "part": "short50", "category": "벤처테마개발론", "num": 43, "question": "Pivot이란 무엇인가?", "phd_answer": "Pivot에 대한 이해는 벤처테마개발론 영역의 다른 개념들을 해석하는 출발점이 된다는 점에서 중요하다. 먼저 개념을 정리하면 다음과 같다. 실험과 고객검증 결과 기존 가설이 맞지 않을 때 제품, 고객, 시장 또는 비즈니스 모델의 핵심 방향을 수정하는 것이다.\n\n이 개념의 내부 구조를 도식화하면 검증 결과에 따른 방향전환의 형태로 나타낼 수 있다. 요소를 열거하는 것과 요소 간의 인과관계를 설명하는 것은 이해의 깊이에서 분명한 차이를 만든다.\n\n실제 사례에 비추어 보면 위 논의가 추상적 정의에 그치지 않음을 알 수 있다. 예컨대 구독형 B2B 스타트업이 성장단계에 맞춰 창업자의 역할을 실행자에서 조직 설계자로 전환하는 상황을 가정할 때, 이 사례는 이론이 현장에서 구체적인 실행 순서로 번역되는 과정을 잘 보여준다. 반대로 대학 실험실 기술을 기반으로 한 딥테크 스타트업이 PoC 이후 사업화 경로를 설계하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n요컨대 Pivot의 핵심은 개념 자체보다 그것이 다른 요소들과 맺는 관계를 설명해내는 데 있다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다.", "answer_len": 984, "mnemonic_raw": "검증 결과에 따른 방향전환", "mnemonic_tree": {"type": "single", "text": "검증 결과에 따른 방향전환"}, "stars": ""}, {"id": 144, "part": "short50", "category": "벤처테마개발론", "num": 44, "question": "PMF란 무엇인가?", "phd_answer": "PMF를 정확히 이해하는 것은 벤처테마개발론 전반의 논리 체계를 파악하는 데 중요한 단서가 된다. 우선 이 개념의 정의를 명확히 해 둘 필요가 있다. Product-Market Fit으로 목표시장의 고객이 제품을 강하게 필요로 하여 반복적으로 사용·구매하는 적합 상태이다.\n\n이 개념을 구성하는 요소들은 반복 사용, 구매의 관계로 연결되어 있으며, 이는 논리의 뼈대를 이룬다. 이러한 연결 관계를 함께 짚을 때 비로소 '왜 그런가'에 대한 설명이 완성된다. 이 가운데 첫 단계인 '반복 사용'은 왜 다른 요소보다 먼저 검토되어야 하는지, 그리고 마지막 단계인 '구매'가 왜 그 지점에서 논의가 마무리되는지를 함께 설명할 수 있어야 한다.\n\n이론을 실제 국면에 적용해 보면 개념의 쓰임새가 한층 뚜렷해진다. 예컨대 AI 에이전트 기반 스타트업이 범용 모델과 차별화되는 도메인 데이터를 축적해가는 상황을 가정할 때, 이는 추상적 개념이 구체적 실행 지침으로 전환되는 과정을 보여준다. 반대로 초기 2인 공동창업팀이 MVP로 유료전환 가설을 검증한 뒤 시드 투자를 유치하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n따라서 PMF는 고정된 정의가 아니라, 상황과 조건에 따라 적용 방식이 달라지는 살아있는 기준으로 이해되어야 한다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다.", "answer_len": 1081, "mnemonic_raw": "반복 사용·구매", "mnemonic_tree": {"type": "list", "children": [{"type": "single", "text": "반복 사용"}, {"type": "single", "text": "구매"}]}, "stars": ""}, {"id": 145, "part": "short50", "category": "벤처테마개발론", "num": 45, "question": "PoC란 무엇인가?", "phd_answer": "PoC를 논하는 것은 벤처테마개발론 분야에서 개념과 실행 사이의 간극을 좁히는 작업이라 할 수 있다. 논의의 출발점이 되는 정의는 다음과 같다. Proof of Concept으로 기술이나 아이디어가 실제 적용환경에서 의도한 기능과 성능을 구현할 수 있는지 검증하는 과정이다.\n\n이 개념을 세분화하면 현장 기술검증의 순서로 요소들이 연결되어 있음을 확인할 수 있다. 이 요소들 사이의 순서와 인과관계를 이해하지 않으면 각 요소를 개별적으로만 파악하게 되어 전체 메커니즘을 설명하기 어렵다.\n\n이론을 실제 국면에 적용해 보면 개념의 쓰임새가 한층 뚜렷해진다. 예컨대 AI 기반 헬스케어 스타트업이 병원 워크플로에 서비스를 통합하며 PMF를 검증하는 상황을 가정할 때, 이러한 적용 과정을 통해 이론적 개념이 현장의 판단 기준으로 작동함을 확인할 수 있다. 반대로 제조 스타트업이 대기업과 정면경쟁 대신 틈새시장에서 초기 충성고객을 확보하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n정리하자면 PoC는 정의, 근거, 적용이라는 세 층위가 함께 성립할 때 비로소 완전한 설명이 된다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다.", "answer_len": 998, "mnemonic_raw": "현장 기술검증", "mnemonic_tree": {"type": "single", "text": "현장 기술검증"}, "stars": ""}, {"id": 146, "part": "short50", "category": "벤처테마개발론", "num": 46, "question": "TAM, SAM, SOM의 의미를 설명하시오.", "phd_answer": "TAM, SAM, SOM의 의미를 정확히 이해하는 것은 벤처테마개발론 전반의 논리 체계를 파악하는 데 중요한 단서가 된다. 이를 개념적으로 규정하면 아래와 같다. TAM은 전체 잠재시장, SAM은 사업모델과 조건상 서비스 가능한 시장, SOM은 현실적으로 확보 가능한 초기 목표시장이다.\n\n핵심 요소들을 재배열해 보면 전체 이후 서비스가능 이후 실제획득과 같은 흐름으로 전개된다는 점이 드러난다. 각 요소가 서로를 어떻게 뒷받침하는지를 설명할 수 있어야 이 개념을 온전히 이해했다고 할 수 있다. 구체적으로 '전체'가 논의의 출발점을 이루고 '실제획득'으로 귀결되는 구조인데, 이 양 끝을 생략한 채 중간 요소만 나열하면 왜 그러한 순서가 성립하는지에 대한 설명력이 떨어진다.\n\n구체적인 상황에 적용해 보면 이 개념의 실천적 가치가 드러난다. 예컨대 대학 실험실 기술을 기반으로 한 딥테크 스타트업이 PoC 이후 사업화 경로를 설계하는 상황을 가정할 때, 이렇게 보면 개념을 이해한다는 것은 곧 무엇을 먼저 검증해야 하는지를 아는 것과 다르지 않다. 반대로 구독형 B2B 스타트업이 성장단계에 맞춰 창업자의 역할을 실행자에서 조직 설계자로 전환하는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n종합하면 TAM, SAM, SOM의 의미는 이론적 정의와 실무적 적용이 맞물릴 때 비로소 온전한 의미를 갖는 개념이라 할 수 있다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다.", "answer_len": 1135, "mnemonic_raw": "전체→서비스가능→실제획득", "mnemonic_tree": {"type": "sequence", "children": [{"type": "single", "text": "전체"}, {"type": "single", "text": "서비스가능"}, {"type": "single", "text": "실제획득"}]}, "stars": ""}, {"id": 147, "part": "short50", "category": "벤처테마개발론", "num": 47, "question": "기술사업화란 무엇인가?", "phd_answer": "기술사업화는 벤처테마개발론에서 이론적 토대와 실무적 판단기준을 동시에 제공하는 핵심 개념이다. 논지를 전개하기 앞서 개념을 다음과 같이 규정한다. 연구개발 결과와 기술을 제품, 서비스, 라이선스 등으로 전환하여 시장에서 경제적 가치를 창출하는 과정이다.\n\n핵심 요소들을 재배열해 보면 기술 이후 시장가치와 같은 흐름으로 전개된다는 점이 드러난다. 각 요소는 독립적으로 작동하는 것이 아니라 앞선 요소의 결과가 다음 요소의 전제가 되는 방식으로 연결되어 있다. '기술'에서 출발해 '시장가치'로 이어지는 이 흐름은 임의의 나열이 아니라, 앞 단계가 다음 단계의 조건이 되는 인과적 배열이다.\n\n이를 현장의 맥락에서 살펴보면 다음과 같은 시사점을 얻을 수 있다. 예컨대 초기 2인 공동창업팀이 MVP로 유료전환 가설을 검증한 뒤 시드 투자를 유치하는 상황을 가정할 때, 이 틀을 적용하면 우선순위가 불분명한 상황에서도 검증 순서와 자원 배분의 근거를 마련할 수 있다. 반대로 AI 에이전트 기반 스타트업이 범용 모델과 차별화되는 도메인 데이터를 축적해가는 상황처럼 조건이 다른 경우에는 동일한 개념 틀이라도 우선순위와 적용 강도가 달라질 수 있으며, 이러한 차이는 조건에 따라 적용 논리가 어떻게 달라지는지를 잘 보여준다.\n\n요컨대 기술사업화의 핵심은 개념 자체보다 그것이 다른 요소들과 맺는 관계를 설명해내는 데 있다. 아울러 이를 실무에 적용할 때에는 정량적 지표와 정성적 판단을 함께 활용하는 것이 바람직하다. 나아가 이 논리는 유사한 구조를 가진 다른 개념에도 확장 적용될 수 있어, 상위 수준의 분석틀로 이해할 필요가 있다. 다만 이러한 관계가 모든 상황에서 동일한 강도로 나타나는 것은 아니며, 산업 특성이나 자원 조건에 따라 그 효과의 크기와 방향이 달라질 수 있다. 이러한 관계는 시장 환경이나 기술 조건이 변화함에 따라 재검토될 필요가 있는 동태적 성격을 갖는다. 이 개념은 독립적으로 작동하기보다 앞서 살펴본 다른 구성요소들과 결합할 때 실제 설명력을 갖는다. 다만 이를 지나치게 일반화할 경우 개별 사례의 특수성을 간과할 위험이 있으므로, 조건부 명제로 이해하는 것이 바람직하다.", "answer_len": 1061, "mnemonic_raw": "기술→시장가치", "mnemonic_tree": {"type": "sequence", "children": [{"type": "single", "text": "기술"}, {"type": "single", "text": "시장가치"}]}, "stars": ""}, {"id": 148, "part": "short50", "category": "벤처테마개발론", "num": 48, "question": "스타트업에서 IP가 중요한 이유를 쓰시오.", "phd_answer": "스타트업에서 IP가 중요한 이유에 대한 이해는 벤처테마개발론 영역의 다른 개념들을 해석하는 출발점이 된다는 점에서 중요하다. 먼저 개념을 정리하면 다음과 같다. 핵심기술과 브랜드의 모방을 방지하고 진입장벽, 투자유치, 기술이전과 라이선스 협상의 자산이 될 수 있기 때문이다.\n\n이 개념의 내부 구조를 도식화하면 보호, 진입장벽, 투자자산의 형태로 나타낼 수 있다. 요소 간의 연결고리를 생략한 채 나열하면 개념의 표면만 알 뿐 그것이 작동하는 방식은 설명하지 못한다. 구체적으로 '보호'가 논의의 출발점을 이루고 '투자자산'으로 귀결되는 구조인데, 이 양 끝을 생략한 채 중간 요소만 나 const PART_LABEL = {esssay:'', 'essay80':'서술·논술형', 'essay20':'논술형(종합)', 'short50':'주관식'};
const CAT_CLASS = {
  '연구방법총론':'cat-1', '인터넷마케팅전략세미나':'cat-2', 'e-Business 전략론':'cat-3', '벤처테마개발론':'cat-4'
};

let answersVisible = true;

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCard(item){
  const cls = CAT_CLASS[item.category] || 'cat-1';
  const stars = item.stars ? `<span class="stars">${item.stars}</span>` : '';
  return `
  <div class="card" data-cat="${escapeHtml(item.category)}" id="card-${item.id}">
    <div class="card-head">
      <span class="badge ${cls}">${escapeHtml(item.category)}</span>
      <span class="badge part">${PART_LABEL[item.part]}</span>
      ${stars}
      <span class="qnum">#${item.id} (${PART_LABEL[item.part]} Q${item.num})</span>
    </div>
    <div class="question">Q. ${escapeHtml(item.question)}</div>
    <div class="answer-label">모범답안 <span class="len">(${item.answer_len}자 · 박사과정 서술)</span></div>
    <div class="answer-hidden-msg" id="hiddenmsg-${item.id}">모범답안이 숨겨져 있습니다. 상단의 "모범답안 보기" 버튼을 눌러 확인하세요.</div>
    <div class="answer-block" id="answer-${item.id}">${escapeHtml(item.phd_answer)}</div>
    <div class="card-foot">
      <button class="reason-btn" onclick="openReason(${item.id})">🔍 상세한 근거 보기</button>
    </div>
  </div>`;
}

function renderAll(){
  const main = document.getElementById('main');
  let html = '';
  let lastPart = null;
  const partTitles = {'essay80':'PART 1~4 · 과목별 서술·논술형 (80문제)', 'essay20':'PART 5 · 논술형 종합 (20문제)', 'short50':'PART 6 · 주관식 (50문제)'};
  DATA.forEach(item=>{
    if(item.part !== lastPart){
      html += `<div class="part-divider" data-partdivider="${item.part}">${partTitles[item.part]}</div>`;
      lastPart = item.part;
    }
    html += renderCard(item);
  });
  main.innerHTML = html;
}
renderAll();

  this.textContent = answersVisible ? '모범답안 숨기기' : '모범답안 보기';
  this.classList.toggle('primary', true);
});

document.getElementById('printBtn').addEventListener('click', ()=> window.print());

// 카테고리 필터
document.getElementById('tabBar').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  document.querySelectorAll('.card').forEach(card=>{
    card.style.display = (cat==='all' || card.dataset.cat===cat) ? '' : 'none';
  });
  document.querySelectorAll('[data-partdivider]').forEach(d=>{
    // hide divider if no visible card follows immediately in that group (simplified: always show when 'all')
    d.style.display = (cat==='all') ? '' : 'none';
  });
});

// ---------- 근거 시각화 ----------
function renderNode(node){
  if(!node) return '';
  switch(node.type){
    case 'sequence': {
      let out = '<div class="flow">';
      node.children.forEach((c,i)=>{
        out += `<div class="flow-node">${escapeHtml(c.text||'')}</div>`;
        if(i < node.children.length-1) out += '<span class="flow-arrow">→</span>';
      });
      out += '</div>';
      return out;
    }
    case 'combine': {
      let out = '<div class="flow">';
      node.children.forEach((c,i)=>{
        out += renderNodeInline(c);
        if(i < node.children.length-1) out += '<span class="flow-plus">+</span>';
      });
      out += '</div>';
      return out;
    }
    case 'compare': {
      let out = '<div class="compare-wrap">';
      node.children.forEach(c=>{
        out += `<div class="compare-card">${renderCompareChild(c)}</div>`;
      });
      out += '</div>';
      return out;
    }
    case 'list': {
      let out = '<div class="chip-row">';
      node.children.forEach(c=> out += `<span class="chip">${escapeHtml(c.text||'')}</span>`);
      out += '</div>';
      return out;
    }
    case 'label': {
      return `<div class="compare-card"><div class="clabel">${escapeHtml(node.label)}</div>${renderNode(node.child)}</div>`;
    }
    case 'single':
    default:
      return `<div class="flow-node" style="display:inline-block;">${escapeHtml(node.text||'')}</div>`;
  }
}
function renderNodeInline(node){
  if(node.type==='single') return `<div class="flow-node">${escapeHtml(node.text||'')}</div>`;
  return renderNode(node);
}
function renderCompareChild(node){
  if(node.type==='label'){
    return `<div class="clabel">${escapeHtml(node.label)}</div>${renderNode(node.child)}`;
  }
  if(node.type==='list'){
    return renderNode(node);
  }
  if(node.type==='single'){
    return `<div class="clabel">${escapeHtml(node.text||'')}</div>`;
  }
  return renderNode(node);
}

function openReason(id){
  const item = DATA.find(d=>d.id===id);
  if(!item) return;
  const body = document.getElementById('modalBody');
  let html = `<h2>상세한 근거 · 논리 구조</h2><div class="modal-q">Q${item.num}. ${escapeHtml(item.question)}</div>`;

  html += `<div class="diagram-title">① 답안 전개 구조 (정의 → 핵심요소 → 설명 → 사례/적용 → 결론)</div>`;
  html += `<div class="flow">
      <div class="flow-node">정의</div><span class="flow-arrow">→</span>
      <div class="flow-node">핵심요소</div><span class="flow-arrow">→</span>
      <div class="flow-node">설명</div><span class="flow-arrow">→</span>
      <div class="flow-node">사례·적용</div><span class="flow-arrow">→</span>
      <div class="flow-node">결론·시사점</div>
    </div>
    <div class="std-flow-explain">본 모범답안은 위 5단계 논증 공식에 따라 문단이 구성되어 있습니다. 1문단은 정의와 이론적 위치, 2문단은 핵심요소 간의 논리적 연결, 3문단은 구체적 사례 적용, 4문단은 한계와 시사점을 다룹니다.</div>`;

  if(item.mnemonic_tree){
    html += `<div class="diagram-title">② 핵심 키워드 구조 (원문 암기 포인트 기반)</div>`;
    html += renderNode(item.mnemonic_tree);
    html += `<div class="diagram-note">위 구조는 원문 암기 포인트 "<strong>${escapeHtml(item.mnemonic_raw)}</strong>"를 시각적으로 재구성한 것입니다. 각 노드는 모범답안 2문단에서 설명하는 핵심 개념 또는 비교 대상에 대응하며, 화살표(→)는 순서·인과 관계를, '+'는 동시에 고려해야 할 병렬 요소를, 좌우 비교 카드는 서로 대비되는 개념 쌍을 나타냅니다.</div>`;
  } else {
    html += `<div class="diagram-title">② 참고</div><div class="diagram-note">이 문항은 원문에 별도의 암기 키워드가 제시되어 있지 않아, ①의 표준 논증 구조를 기준으로 학습하는 것을 권장합니다.</div>`;
  }

  body.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', ()=>{
  document.getElementById('modalOverlay').classList.remove('open');
});
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='modalOverlay') document.getElementById('modalOverlay').classList.remove('open');
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('open');
});
</script>
